# Dependabot opens pull requests when a dependency has a newer version or a security fix.
version: 2
updates:
  # The GitHub Actions used by the pipeline (checkout, azure/login)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # NuGet packages for the ASP.NET Core site
  - package-ecosystem: nuget
    directory: /GlennSite
    schedule:
      interval: weekly

  # NuGet packages for the test project
  - package-ecosystem: nuget
    directory: /tests/GlennSite.Tests
    schedule:
      interval: weekly

  # Base images in the Dockerfile (.NET SDK and runtime)
  - package-ecosystem: docker
    directory: /GlennSite
    schedule:
      interval: weekly
    # The site targets .NET 10 (LTS). Moving to a new .NET major version means retargeting
    # GlennSite.csproj and both images together, so it is done on purpose, not by a routine bump.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
